name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.mjs
      - run: npm run build
      - name: Search benchmark
        run: npm run bench | tee bench-result.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-node${{ matrix.node }}
          path: bench-result.txt
