name: Seed starter issues (one-off)

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create starter issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "good first issue" --repo "$REPO" --color 7057ff --description "Good for newcomers" 2>/dev/null || true
          gh label create "help wanted" --repo "$REPO" --color 008672 --description "Extra attention is needed" 2>/dev/null || true
          gh label create "agent support" --repo "$REPO" --color 1d76db --description "Support for a specific agent app" 2>/dev/null || true

          gh issue create --repo "$REPO" --label "good first issue" --label "agent support" \
            --title "setup: add Gemini CLI and Cline snippets" \
            --body "$(printf '%s\n' \
              '`stashpad setup` prints MCP settings for generic clients, Claude Code, VS Code and Codex (`src/setup.mjs`). Add two more clients:' '' \
              '- `gemini`: Gemini CLI settings (`~/.gemini/settings.json`, `mcpServers` block)' \
              '- `cline`: Cline MCP settings' '' \
              'Each snippet should use the full Node path the other clients use (see `launcher()`), and `test/plugin.test.mjs` should cover the new names. Please check the current settings format in each project'"'"'s docs and link it in the pull request.')"

          gh issue create --repo "$REPO" --label "good first issue" \
            --title "Built-in synonyms for German and French" \
            --body "$(printf '%s\n' \
              'Search uses small built-in synonym groups in English and Dutch (`BUILTIN_GROUPS` in `src/synonyms.mjs`). Add the same groups in German and French (password/Passwort/mot de passe, database/Datenbank/base de données, ...).' '' \
              'Keep them general (no project words), and add a test in `test/synonyms.test.mjs` that a German query finds an English note through a synonym.')"

          gh issue create --repo "$REPO" --label "good first issue" \
            --title "export: a single readable Markdown file" \
            --body "$(printf '%s\n' \
              '`stashpad export` writes JSON Lines. Add `--format markdown` that writes one readable file: a heading per memory (id, kind, dates, source) and its text, current memories first, ended ones in a section at the end with `--all`.' '' \
              'It must refuse to overwrite (like the JSON export) and warn when the store is encrypted, because the output is plain text. Code: `src/export.mjs`, `src/cli.mjs`; tests in `test/`.')"

          gh issue create --repo "$REPO" --label "help wanted" --label "agent support" \
            --title "Automatic handoff before compaction for Codex CLI sessions" \
            --body "$(printf '%s\n' \
              '`stashpad hook pre-compact` reads the end of a Claude Code transcript to leave a short handoff: the last requests and the files written (`summarizeTranscript` in `src/hooks.mjs`). Codex CLI keeps its sessions as JSON Lines too, in another shape.' '' \
              'Make `summarizeTranscript` understand Codex session files as well (detect the format, keep it deterministic, no model calls), with a small fixture in the tests. A link to where Codex documents or stores the format helps the review.')"
