name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, for example what your agent forgot or got wrong.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the principles
      description: See "Rules that keep Stashpad safe" in CONTRIBUTING.md.
      options:
        - label: This keeps memories as plain files, keeps the review queue and works with any agent.
