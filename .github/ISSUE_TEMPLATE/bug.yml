name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "output of: stashpad --version"
  - type: input
    id: agent
    attributes:
      label: Agent and operating system
      placeholder: "e.g. Claude Code on Windows 11, Codex CLI on macOS, Cursor on Linux"
  - type: textarea
    id: doctor
    attributes:
      label: Output of stashpad doctor --client
      description: Remove anything private first. Never paste memory contents or passphrases.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
