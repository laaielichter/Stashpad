name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Do not use this form. See SECURITY.md and report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. node bin/stashpad.mjs save ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stashpad version
      placeholder: "output of: node bin/stashpad.mjs --version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and operating system
      placeholder: "e.g. Node 22, Windows 11"
  - type: input
    id: agent
    attributes:
      label: Which agent or MCP client, if any?
      placeholder: "e.g. command line only, or the name of your agent"
  - type: textarea
    id: doctor
    attributes:
      label: Output of `stashpad doctor`
      description: Remove anything private before pasting.
      render: shell
